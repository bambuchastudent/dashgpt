name: DashGPT quality

on:
  pull_request:
  push:
    branches:
      - develop
      - feature/m3-immutable-pages-chatgpt-plugin

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
