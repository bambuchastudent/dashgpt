name: Inspect shared ChatGPT result

on:
  push:
    branches:
      - feature/m3-immutable-pages-chatgpt-plugin
    paths:
      - .github/workflows/inspect-shared-chat.yml

permissions:
  contents: read

jobs:
  inspect-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Parse shared conversation
        env:
          SHARE_URL: "https://chatgpt.com/share/6a787ebb-dd38-83eb-940a-bd6c77efad95?ogimg=plain"
        run: |
          node --input-type=module <<'NODE'
          import { fetchChatGptShare } from "chatgpt-share-parser";
          const chat = await fetchChatGptShare(process.env.SHARE_URL);
          console.log("DASHGPT_SHARED_CHAT_JSON_BEGIN");
          console.log(JSON.stringify(chat, null, 2));
          console.log("DASHGPT_SHARED_CHAT_JSON_END");
          NODE
