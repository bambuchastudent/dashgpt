name: Live shared chat smoke

on:
  push:
    branches:
      - smoke/live-shared-chat

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production deploy and resolve real ChatGPT share
        shell: bash
        run: |
          set -euo pipefail
          SHARE='https://chatgpt.com/share/6a7a445b-a420-83ea-9c36-3c10fd1ce85f'
          ENCODED=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("https://chatgpt.com/share/6a7a445b-a420-83ea-9c36-3c10fd1ce85f", safe=""))')
          URL="https://dashgpt.dimkashir.workers.dev/api/shared-chat?url=${ENCODED}"
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt ${attempt}: ${URL}"
            STATUS=$(curl -L --silent --show-error --max-time 45 -o /tmp/share.json -w '%{http_code}' "$URL" || true)
            cat /tmp/share.json 2>/dev/null || true
            echo
            if [ "$STATUS" = "200" ] && python3 - <<'PY'
          import json
          p=json.load(open('/tmp/share.json'))
          assert p.get('title')
          replies=p.get('replies') or []
          assert len(replies) >= 2
          assert any(r.get('type') == 'user' and r.get('statement') for r in replies)
          assert any(r.get('type') == 'assistant' and r.get('statement') for r in replies)
          print('LIVE_OK', p.get('retrieval'), p.get('title'), len(replies))
          PY
            then
              exit 0
            fi
            sleep 15
          done
          echo 'Live production resolver did not return a readable conversation.' >&2
          exit 1
