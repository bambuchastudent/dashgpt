name: Live shared chat smoke

on:
  push:
    branches:
      - smoke/live-shared-chat

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Resolve two real public ChatGPT shares in production
        shell: bash
        run: |
          set -euo pipefail

          resolve_one() {
            SHARE="$1"
            LABEL="$2"
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SHARE', safe=''))")
            URL="https://dashgpt.dimkashir.workers.dev/api/shared-chat?url=${ENCODED}"

            for attempt in 1 2 3 4 5 6; do
              echo "${LABEL} attempt ${attempt}"
              STATUS=$(curl -L --silent --show-error --max-time 45 -o /tmp/share.json -w '%{http_code}' "$URL" || true)
              cat /tmp/share.json 2>/dev/null || true
              echo

              if [ "$STATUS" = "200" ] && python3 - <<'PY'
          import json
          p=json.load(open('/tmp/share.json'))
          replies=p.get('replies') or []
          assert len(replies) >= 2
          assert any(r.get('type') == 'user' and r.get('statement') for r in replies)
          assert any(r.get('type') == 'assistant' and r.get('statement') for r in replies)
          print('LIVE_OK', p.get('retrieval'), p.get('title'), len(replies))
          PY
              then
                return 0
              fi
              sleep 10
            done

            echo "${LABEL} failed" >&2
            return 1
          }

          resolve_one 'https://chatgpt.com/share/6a7a445b-a420-83ea-9c36-3c10fd1ce85f' 'older fixture'
          resolve_one 'https://chatgpt.com/share/6a7a59e3-c9d4-83ea-bb8d-88c57f00b491' 'fresh fixture'
