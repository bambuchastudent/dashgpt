name: Live shared chat smoke

on:
  push:
    branches:
      - smoke/live-shared-chat

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe fresh public ChatGPT share
        shell: bash
        run: |
          set -uo pipefail
          SHARE='https://chatgpt.com/share/6a7a59e3-c9d4-83ea-bb8d-88c57f00b491'
          ID='6a7a59e3-c9d4-83ea-bb8d-88c57f00b491'
          ENCODED=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("https://chatgpt.com/share/6a7a59e3-c9d4-83ea-bb8d-88c57f00b491", safe=""))')
          probe() {
            NAME="$1"; URL="$2"
            echo "===== ${NAME} ====="
            STATUS=$(curl -L --silent --show-error --max-time 40 -A 'Mozilla/5.0' -o "/tmp/${NAME}.out" -w '%{http_code}' "$URL" || true)
            echo "STATUS=${STATUS} BYTES=$(wc -c < "/tmp/${NAME}.out" 2>/dev/null || echo 0)"
            head -c 1200 "/tmp/${NAME}.out" 2>/dev/null || true
            echo; echo
          }
          probe direct "$SHARE"
          probe backend "https://chatgpt.com/backend-api/share/${ID}"
          probe jina "https://r.jina.ai/${SHARE}"
          probe jina_backend "https://r.jina.ai/https://chatgpt.com/backend-api/share/${ID}"
          probe allorigins "https://api.allorigins.win/raw?url=${ENCODED}"
          probe dashgpt "https://dashgpt.dimkashir.workers.dev/api/shared-chat?url=${ENCODED}"

      - name: Require production resolver to read fresh share eventually
        shell: bash
        run: |
          set -euo pipefail
          ENCODED=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("https://chatgpt.com/share/6a7a59e3-c9d4-83ea-bb8d-88c57f00b491", safe=""))')
          URL="https://dashgpt.dimkashir.workers.dev/api/shared-chat?url=${ENCODED}"
          for attempt in 1 2 3 4; do
            STATUS=$(curl -L --silent --show-error --max-time 45 -o /tmp/share.json -w '%{http_code}' "$URL" || true)
            cat /tmp/share.json 2>/dev/null || true
            echo
            if [ "$STATUS" = "200" ] && python3 - <<'PY'
          import json
          p=json.load(open('/tmp/share.json'))
          replies=p.get('replies') or []
          assert len(replies) >= 2
          assert any(r.get('type') == 'user' and r.get('statement') for r in replies)
          assert any(r.get('type') == 'assistant' and r.get('statement') for r in replies)
          print('LIVE_OK', p.get('retrieval'), p.get('title'), len(replies))
          PY
            then
              exit 0
            fi
            sleep 10
          done
          exit 1
