name: F20 targeted browser diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  f20-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run Feature 20 browser scenarios
        run: >-
          npx playwright test
          tests/chatgpt-history-import.spec.mjs
          tests/chatgpt-history-import-state.spec.mjs
          tests/onboarding.spec.mjs
          tests/unified-onboarding.spec.mjs
          --project=desktop-chromium
          --reporter=line
