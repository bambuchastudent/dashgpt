name: DashGPT checks

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Probe production GitHub storage
        run: node scripts/probe-production-github-status.mjs
