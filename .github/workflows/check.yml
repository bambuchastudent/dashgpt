name: DashGPT checks

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deterministic:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check

  browser:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - mobile-chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project="${{ matrix.project }}"
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  canonical-full:
    if: >-
      github.actor == github.repository_owner &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[verify:full]')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:full
      - name: Upload canonical Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-canonical-full-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  check:
    if: >-
      always() &&
      github.actor == github.repository_owner &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - deterministic
      - browser
      - canonical-full
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all canonical shards
        env:
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CANONICAL_RESULT: ${{ needs.canonical-full.result }}
          CANONICAL_REQUIRED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[verify:full]') }}
        run: |
          test "$DETERMINISTIC_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          if [ "$CANONICAL_REQUIRED" = "true" ]; then
            test "$CANONICAL_RESULT" = "success"
          else
            test "$CANONICAL_RESULT" = "skipped"
          fi
