name: F9 OpenSpec strict gate

on:
  push:
    branches:
      - feature/f9-zero-friction-mobile-demo

permissions:
  contents: read

jobs:
  openspec-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@latest
      - run: openspec --version
      - run: openspec validate f9-zero-friction-mobile-demo --strict
