name: M2 shared-chat smoke

on:
  pull_request:
    paths:
      - ".github/workflows/m2-shared-chat-smoke.yml"

permissions:
  contents: read

jobs:
  parse-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - name: Fetch and parse shared ChatGPT conversation
        env:
          SHARE_URL: "https://chatgpt.com/share/6a7873ab-2160-83eb-a57a-9fbdc7034314?ogimg=plain"
        run: |
          node --input-type=module <<'NODE'
          import { fetchChatGptShare } from "chatgpt-share-parser";
          const chat = await fetchChatGptShare(process.env.SHARE_URL);
          console.log("DASHGPT_SHARED_CHAT_JSON_BEGIN");
          console.log(JSON.stringify(chat, null, 2));
          console.log("DASHGPT_SHARED_CHAT_JSON_END");
          NODE
