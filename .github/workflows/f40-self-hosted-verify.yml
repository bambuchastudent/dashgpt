name: F40 self-hosted verification

on:
  push:
    branches:
      - f40-one-sentence-product-explanation

permissions:
  contents: read

jobs:
  openspec:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - run: node --version && npm --version
      - run: npm install --global @fission-ai/openspec@latest
      - run: openspec validate f40-one-sentence-product-explanation --type change --strict --no-interactive
